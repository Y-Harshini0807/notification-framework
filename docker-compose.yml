services:
  mongodb:
    image: mongo:7
    container_name: nf-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nf-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  auth-server:
    image: node:20
    container_name: nf-auth-server
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./login_registration/server:/app
      - auth_node_modules:/app/node_modules
    environment:
      - MONGO_URL=mongodb://mongodb:27017/notification_db
      - FASTAPI_URL=http://notification-api:8000
    command: sh -c "npm install && npm start"
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - notification-api

  notification-api:
    image: python:3.11-slim
    container_name: nf-notification-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./notification_service:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - MONGO_URL=mongodb://mongodb:27017
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn pymongo python-dotenv celery kombu requests python-multipart google-auth &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - rabbitmq

  notification-worker:
    image: python:3.11-slim
    container_name: nf-notification-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./notification_service:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - MONGO_URL=mongodb://mongodb:27017
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    command: >
      sh -c "pip install --no-cache-dir pymongo python-dotenv celery kombu requests google-auth &&
             celery -A tasks worker --loglevel=info --concurrency=4 -Q email-notify-q,sms-notify-q,whatsapp-notify-q,push-notify-q"
    depends_on:
      - mongodb
      - rabbitmq

  login-client:
    image: node:20
    container_name: nf-login-client
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./login_registration/client:/app
      - login_client_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - auth-server
      - notification-api

  notification-client:
    image: node:20
    container_name: nf-notification-client
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./notification_service:/app
      - notification_client_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    depends_on:
      - notification-api

volumes:
  mongo_data:
  rabbitmq_data:
  auth_node_modules:
  login_client_node_modules:
  notification_client_node_modules:
